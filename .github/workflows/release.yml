name: Release check
on:
  release:
    types: [published]
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(jq -r .version custom_components/vav_balancer/manifest.json)
          test "$TAG" = "$MANIFEST" || { echo "tag $TAG != manifest $MANIFEST"; exit 1; }